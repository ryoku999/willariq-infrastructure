services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: willay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-willay}
      POSTGRES_USER: ${POSTGRES_USER:-willay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Lima
      PGTZ: America/Lima
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
      - ../backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-willay} -d ${POSTGRES_DB:-willay}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - postgres_net

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: willay-cloudbeaver
    restart: unless-stopped
    ports:
      - "${CLOUDBEAVER_PORT:-8978}:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    environment:
      - CB_ADMIN_NAME=${CLOUDBEAVER_ADMIN_NAME:-admin}
      - CB_ADMIN_PASSWORD=${CLOUDBEAVER_ADMIN_PASSWORD:-admin}
      - CB_SERVER_NAME=Willay-CloudBeaver
      # Opcional: Deshabilitar acceso anónimo (recomendado)
      - CB_ANONYLOUS_ACCESS_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgres_net

volumes:
  postgres_data:
  cloudbeaver_data:

networks:
  postgres_net:
    driver: bridge